# Đăng thư mục site/ lên GitHub Pages: https://nghiatrh-debug.github.io/dailywklreport/ (repo công khai, chỉ chứa trang mở app)
# Trang này nhúng Web App (Apps Script) → không còn dải "This application was created by a Google Apps Script user",
# và cho phép "Thêm vào màn hình chính" trên điện thoại (biểu tượng app).
# Bật 1 lần: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Trang GitHub Pages

on:
  push:
    branches: [main]
    paths: ['site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    name: Đăng trang site/
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
