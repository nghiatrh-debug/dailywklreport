# Tự động kiểm thử và đưa code lên Google Apps Script
# - Mỗi lần đẩy code lên nhánh main: chạy kiểm thử máy chủ + giao diện → đưa code vào Apps Script (bản "Thử nghiệm" /dev).
#   Link chính thức /exec cho kỹ sư KHÔNG đổi.
# - Phát hành lên link chính thức /exec: đẩy code sang nhánh "release" (git push origin main:release)
#   hoặc vào tab Actions → Run workflow → tick "release".
name: Kiểm thử & triển khai Apps Script

on:
  push:
    branches: [main, release]
    paths-ignore: ['docs/**', 'README.md', 'site/**', '.github/workflows/pages.yml']
  workflow_dispatch:
    inputs:
      release:
        description: 'Phát hành lên link chính thức (/exec)'
        type: boolean
        default: false
      note:
        description: 'Ghi chú phiên bản'
        required: false
        default: ''

concurrency:
  group: apps-script-deploy
  cancel-in-progress: false

env:
  DEPLOYMENT_ID: AKfycbxmF9lIdXFVNxDS6CMPVp7GWarUa_ZGJOix_dc0nQZmQkbloBR6otP6-sG7h-wyJTAL

jobs:
  test:
    name: Kiểm thử máy chủ (giả lập Apps Script)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Chạy kiểm thử
        run: node tests/gastest.js

  test-ui:
    name: Kiểm thử giao diện (điện thoại 375/390/412 px + máy tính)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cài Playwright + Chromium
        run: |
          npm install --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Chạy kiểm thử giao diện
        run: node tests/ui.js
      - name: Lưu ảnh chụp màn hình
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ui-screenshots
          path: tests/shots/
          retention-days: 14

  deploy:
    name: Đưa code lên Apps Script
    needs: [test, test-ui]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Cài clasp
        run: npm install -g @google/clasp@3
      - name: Nạp thông tin đăng nhập clasp (từ secret CLASPRC_JSON)
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Chưa có secret CLASPRC_JSON – xem docs/HUONG_DAN_TRIEN_KHAI.md mục Tự động triển khai"
            exit 1
          fi
          printf '%s' "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          python3 -c "import json,os; d=json.load(open(os.path.expanduser('~/.clasprc.json'))); print('::notice title=clasprc::Định dạng', 'v3 (tokens)' if 'tokens' in d else ('v2 (token)' if 'token' in d else 'không rõ: '+','.join(d.keys())))" || echo "::error title=Secret CLASPRC_JSON::Nội dung không phải JSON hợp lệ – copy lại toàn bộ file .clasprc.json"
      - name: Đẩy code (cập nhật bản Thử nghiệm /dev)
        shell: bash
        run: |
          set +e
          clasp push -f > /tmp/push.txt 2>&1; rc=$?
          cat /tmp/push.txt
          if [ $rc -ne 0 ]; then echo "::error title=clasp push thất bại::$(tail -c 900 /tmp/push.txt | tr '\n' ' ')"; exit $rc; fi
      - name: Phát hành lên link chính thức /exec
        if: github.ref == 'refs/heads/release' || (github.event_name == 'workflow_dispatch' && inputs.release)
        env:
          NOTE: ${{ inputs.note }}
        run: |
          DESC="${GITHUB_REF_NAME} $(date -u +%Y-%m-%d) ${GITHUB_SHA::7} ${NOTE}"
          set +e
          clasp deploy -i "$DEPLOYMENT_ID" -d "$DESC" > /tmp/dep.txt 2>&1; rc=$?
          cat /tmp/dep.txt
          if [ $rc -ne 0 ]; then echo "::error title=clasp deploy thất bại::$(tail -c 900 /tmp/dep.txt | tr '\n' ' ')"; exit $rc; fi
          echo "### ✔ Đã phát hành: $DESC" >> "$GITHUB_STEP_SUMMARY"
      - name: Xóa thông tin đăng nhập
        if: always()
        run: rm -f "$HOME/.clasprc.json"
