<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lập báo cáo thi công</title>
<meta name="theme-color" content="#4f46e5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Báo cáo thi công">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="favicon.png?v=2">
<link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
<style>
  html,body{margin:0;height:100%;background:#f8fafc;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  #app{position:fixed;inset:0;width:100%;height:100%;border:0;display:block}
  #ld{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;color:#475569;font-size:14px;transition:opacity .3s}
  #ld img{width:72px;height:72px;border-radius:18px;box-shadow:0 8px 24px #4f46e540}
  #ld.off{opacity:0;pointer-events:none}
  .sp{width:26px;height:26px;border:3px solid #c7d2fe;border-top-color:#4f46e5;border-radius:50%;animation:r 1s linear infinite}
  @keyframes r{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<div id="ld"><img src="icon-192.png" alt=""><div class="sp"></div><div>Đang mở Báo cáo ngày…</div></div>
<iframe id="app" title="Lập báo cáo thi công" allow="geolocation; clipboard-write; camera" referrerpolicy="no-referrer-when-downgrade"></iframe>
<script>
/* Link Web App (Apps Script, bản chính thức /exec). Dự án khác: đổi dòng này. */
const APP_URL = 'https://script.google.com/macros/s/AKfycbxmF9lIdXFVNxDS6CMPVp7GWarUa_ZGJOix_dc0nQZmQkbloBR6otP6-sG7h-wyJTAL/exec';
const q = new URLSearchParams(location.search), v = q.get('v');           // ?v=<mã> → trang xác thực
const f = document.getElementById('app');
/* ?p=<mã dự án>: nhớ vào máy để mở lại PWA vẫn đúng dự án. ?p= rỗng hoặc ?p=- → xóa đã nhớ. Mã sai ký tự → bỏ qua. */
const PK = 'dwr_p', OK = /^[A-Za-z0-9_-]{1,32}$/;
let p = '';
if (v !== null) {
  /* Link tra QR (?v=): chỉ dùng p trên chính URL; không p → dự án mặc định; không đọc/ghi mã đã nhớ. */
  const raw = q.get('p');
  if (raw && OK.test(raw)) p = raw;
} else try {
  const raw = q.get('p');
  if (raw === '' || raw === '-') localStorage.removeItem(PK);
  else if (raw !== null && OK.test(raw)) localStorage.setItem(PK, raw);
  const s = localStorage.getItem(PK);
  if (s && OK.test(s)) p = s;
} catch (e) { const raw = q.get('p'); if (raw && OK.test(raw)) p = raw; }
const ps = [];
if (p) ps.push('p=' + encodeURIComponent(p));
if (v) ps.push('v=' + encodeURIComponent(v));
f.src = APP_URL + (ps.length ? '?' + ps.join('&') : '');
f.addEventListener('load', () => setTimeout(() => document.getElementById('ld').classList.add('off'), 300));
setTimeout(() => document.getElementById('ld').classList.add('off'), 15000);
</script>
</body>
</html>
